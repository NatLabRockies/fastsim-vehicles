<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Vehicle Search</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --bg: #ffffff;
      --border: #d0d0d0;
      --muted: #666666;
      --accent: #1a56db;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e8e8e8;
        --bg: #1e1e1e;
        --border: #3a3a3a;
        --muted: #a0a0a0;
        --accent: #6ea8fe;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }

    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    label {
      display: flex;
      flex-direction: column;
      font-size: 0.75rem;
      color: var(--muted);
      gap: 0.25rem;
    }

    input,
    select {
      font: inherit;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--fg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th,
    td {
      text-align: left;
      padding: 0.4rem 0.5rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    th[data-field] {
      cursor: pointer;
      user-select: none;
    }

    th[data-field]:hover {
      color: var(--fg);
    }

    a.download {
      color: var(--accent);
      text-decoration: none;
    }

    a.download:hover {
      text-decoration: underline;
    }

    #status {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
    }

    #maximize {
      position: fixed;
      top: 0.5rem;
      right: 0.5rem;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
    }

    #maximize:hover {
      color: var(--fg);
      border-color: var(--accent);
    }

    #results-wrap {
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <button id="maximize" type="button" title="Maximize" aria-label="Maximize" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3" />
      <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
      <path d="M3 16v3a2 2 0 0 0 2 2h3" />
      <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
    </svg>
  </button>
  <form id="query-form">
    <label>FASTSim version
      <input type="number" id="fastsim_version" min="2" max="3" value="3" />
    </label>
    <label>Powertrain
      <select id="powertrain">
        <option value="">Any</option>
        <option value="conv">Conventional (conv)</option>
        <option value="hev">Hybrid Electric (hev)</option>
        <option value="phev">Plug-in Hybrid (phev)</option>
        <option value="bev">Battery Electric (bev)</option>
        <!-- <option value="fcev">Fuel Cell Electric (fcev)</option> -->
      </select>
    </label>
    <label>Make
      <input type="text" id="make" placeholder="e.g. ford (substring)" />
    </label>
    <label>Model
      <input type="text" id="model" placeholder="e.g. f-150 (substring)" />
    </label>
    <label>Year
      <input type="text" id="year" placeholder="e.g. 2020 (substring)" />
    </label>
    <label>Variant
      <input type="text" id="variant" placeholder="e.g. base (substring)" />
    </label>
  </form>

  <div id="status">Loading vehicle index&hellip;</div>
  <div id="results-wrap">
    <table>
      <thead>
        <tr>
          <th data-field="make">Make</th>
          <th data-field="model">Model</th>
          <th data-field="year">Year</th>
          <th data-field="powertrain">Powertrain</th>
          <th data-field="variant">Variant</th>
          <th data-field="revision">Rev.</th>
          <th>Download</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </div>

  <script type="module">
    import init, { parse_vehicles_jsonl, search_entries, build_download_url } from './pkg/fastsim_schema.js';

    const VEHICLES_JSONL_URL =
      'https://raw.githubusercontent.com/NatLabRockies/fastsim-vehicles/main/v1/vehicles.jsonl';

    const statusEl = document.getElementById('status');
    const resultsBody = document.getElementById('results-body');
    const form = document.getElementById('query-form');
    const fields = ['fastsim_version', 'powertrain', 'make', 'model', 'year', 'variant'];

    // Expands the widget's wrapper div (in the embedding page) to cover the
    // full page instead of just its 65vh iframe slot, via same-origin
    // parent access.
    const maximizeBtn = document.getElementById('maximize');
    const maximizeIcon = maximizeBtn.querySelector('svg');
    const MAXIMIZE_PATHS = maximizeIcon.innerHTML;
    const MINIMIZE_PATHS = `
      <path d="M8 3v3a2 2 0 0 1-2 2H3" />
      <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
      <path d="M3 16h3a2 2 0 0 1 2 2v3" />
      <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
    `;

    function setMaximized(isMaximized) {
      window.parent.document.body.classList.toggle('search-maximized', isMaximized);
      maximizeIcon.innerHTML = isMaximized ? MINIMIZE_PATHS : MAXIMIZE_PATHS;
      maximizeBtn.title = isMaximized ? 'Restore' : 'Maximize';
      maximizeBtn.setAttribute('aria-label', maximizeBtn.title);
    }

    if (window.parent !== window) {
      maximizeBtn.hidden = false;
      maximizeBtn.addEventListener('click', () => {
        setMaximized(!window.parent.document.body.classList.contains('search-maximized'));
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') setMaximized(false);
      });
    }

    let entries = [];
    let lastResults = [];

    // Make is already the dominant key in search_entries' default order, so
    // selecting it here just marks the column in the UI without resorting.
    const NUMERIC_FIELDS = new Set(['year', 'revision']);
    const sortState = { field: 'make', dir: 'asc' };
    const sortLabels = {
      make: 'Make',
      model: 'Model',
      year: 'Year',
      powertrain: 'Powertrain',
      variant: 'Variant',
      revision: 'Rev.',
    };
    const headerEls = {};
    for (const th of document.querySelectorAll('th[data-field]')) {
      headerEls[th.dataset.field] = th;
      th.addEventListener('click', () => {
        if (sortState.field === th.dataset.field) {
          sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
        } else {
          sortState.field = th.dataset.field;
          sortState.dir = NUMERIC_FIELDS.has(th.dataset.field) ? 'desc' : 'asc';
        }
        updateHeaders();
        render();
      });
    }

    function updateHeaders() {
      for (const [field, th] of Object.entries(headerEls)) {
        const arrow = sortState.field !== field ? '' : sortState.dir === 'asc' ? ' ▲' : ' ▼';
        th.textContent = sortLabels[field] + arrow;
      }
    }
    updateHeaders();

    function compareEntries(a, b, field) {
      if (field === 'revision') return a.revision - b.revision;
      if (field === 'year') {
        const an = parseInt(a.year, 10);
        const bn = parseInt(b.year, 10);
        if (!Number.isNaN(an) && !Number.isNaN(bn)) return an - bn;
      }
      const av = String(a[field]).toLowerCase();
      const bv = String(b[field]).toLowerCase();
      return av < bv ? -1 : av > bv ? 1 : 0;
    }

    function applySort(results) {
      if (!sortState.field) return results;
      const dir = sortState.dir === 'desc' ? -1 : 1;
      return results.slice().sort((a, b) => dir * compareEntries(a, b, sortState.field));
    }

    function currentQuery() {
      const query = {};
      for (const field of fields) {
        const value = document.getElementById(field).value.trim();
        if (!value) continue;
        query[field] = field === 'fastsim_version' ? parseInt(value, 10) : value;
      }
      return query;
    }

    function renderResults(results) {
      resultsBody.replaceChildren();
      for (const entry of results) {
        const row = document.createElement('tr');
        const extension = entry.path.slice(entry.path.lastIndexOf('.') + 1);
        const downloadUrl = build_download_url(entry.id, extension);
        const filename = `${entry.make}_${entry.model}_${entry.year}_${entry.powertrain}_${entry.variant}_r${entry.revision}.${extension}`;
        row.innerHTML = `
        <td>${entry.make}</td>
        <td>${entry.model}</td>
        <td>${entry.year}</td>
        <td>${entry.powertrain}</td>
        <td>${entry.variant}</td>
        <td>r${entry.revision}</td>
        <td><a class="download" href="${downloadUrl}" data-filename="${filename}">Download</a></td>
      `;
        resultsBody.appendChild(row);
      }
      statusEl.textContent = `${results.length} of ${entries.length} vehicles`;
    }

    function render() {
      renderResults(applySort(lastResults));
    }

    function runSearch() {
      lastResults = search_entries(JSON.stringify(entries), JSON.stringify(currentQuery()));
      render();
    }

    form.addEventListener('input', runSearch);

    // Cross-origin URLs ignore the `download` attribute (the browser just
    // navigates instead), and navigating the embedding iframe to
    // raw.githubusercontent.com hits its anti-framing header and fails
    // outright. Fetch the file and save it from a same-origin blob: URL
    // instead, which sidesteps both problems.
    resultsBody.addEventListener('click', async (event) => {
      const link = event.target.closest('a.download');
      if (!link) return;
      event.preventDefault();
      try {
        const response = await fetch(link.href);
        if (!response.ok) throw new Error(`fetch failed: ${response.status}`);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const tempLink = document.createElement('a');
        tempLink.href = blobUrl;
        tempLink.download = link.dataset.filename;
        tempLink.click();
        URL.revokeObjectURL(blobUrl);
      } catch (err) {
        console.error(err);
        window.open(link.href, '_blank', 'noopener');
      }
    });

    try {
      await init();
      const response = await fetch(VEHICLES_JSONL_URL);
      if (!response.ok) throw new Error(`fetch failed: ${response.status}`);
      const text = await response.text();
      entries = parse_vehicles_jsonl(text);
      runSearch();
    } catch (err) {
      statusEl.textContent = `Failed to load vehicle index: ${err.message}`;
      console.error(err);
    }
  </script>
</body>

</html>
